plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

def oneSignalAppId = project.findProperty('ONESIGNAL_APP_ID') ?: ''

android { compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; namespace 'com.review.smart'; compileSdk 35
    defaultConfig { applicationId 'com.review.smart'; minSdk 24; targetSdk 35; versionCode 2; versionName '2.0.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    buildFeatures { compose true; buildConfig true }; kotlinOptions { jvmTarget = "17" }
    defaultConfig { buildConfigField 'String', 'ONESIGNAL_APP_ID', '"' + oneSignalAppId.replace('"','') + '"' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.onesignal:OneSignal:5.1.14'
}
